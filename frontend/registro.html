<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Registro de usuario — V.I Sistema de Vigilancia Inteligente</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <header class="top-nav">
    <span class="brand"><span class="brand-mark">V.I</span><span class="brand-sep">|</span>Sistema de Vigilancia Inteligente</span>
  </header>

  <main class="auth-main">
    <section class="auth-card" aria-labelledby="registro-title">
      <div class="auth-card-head">
        <h1 class="auth-title" id="registro-title">Registro de usuario</h1>
      </div>

      <div class="auth-card-body">
        <form id="registro-form" class="form-stack" novalidate autocomplete="off">
          <div id="registro-alert" class="alert alert-error" role="alert" aria-live="assertive" hidden>
            <p class="alert-heading" id="registro-alert-title">No se pudo completar el registro de usuario.</p>
            <p class="alert-text" id="registro-alert-text">El usuario o correo ya existe, o las contraseñas ingresadas no coinciden.</p>
          </div>

          <div class="field">
            <label class="field-label" for="usuario">Usuario *</label>
            <input class="text-input" type="text" id="usuario" name="usuario" placeholder="Ingrese un nombre de usuario" maxlength="50" autocomplete="username" autocapitalize="none" spellcheck="false" required>
            <p class="field-error" id="usuario-error" hidden></p>
          </div>

          <div class="field">
            <label class="field-label" for="correo">Correo electrónico *</label>
            <input class="text-input" type="email" id="correo" name="correo" placeholder="Ingrese su correo electrónico" maxlength="120" autocomplete="email" autocapitalize="none" spellcheck="false" required>
            <p class="field-error" id="correo-error" hidden></p>
          </div>

          <div class="field">
            <label class="field-label" for="clave">Contraseña *</label>
            <div class="password-wrap">
              <input class="text-input" type="password" id="clave" name="clave" placeholder="Ingrese su contraseña" maxlength="72" autocomplete="new-password" required>
              <button class="password-toggle" type="button" data-toggle-password="clave" aria-controls="clave" aria-label="Mostrar contraseña">Mostrar</button>
            </div>
            <p class="field-error" id="clave-error" hidden></p>
          </div>

          <div class="field">
            <label class="field-label" for="confirmar-clave">Confirmar contraseña *</label>
            <div class="password-wrap">
              <input class="text-input" type="password" id="confirmar-clave" name="confirmar_clave" placeholder="Repita su contraseña" maxlength="72" autocomplete="new-password" required>
              <button class="password-toggle" type="button" data-toggle-password="confirmar-clave" aria-controls="confirmar-clave" aria-label="Mostrar confirmación de contraseña">Mostrar</button>
            </div>
            <p class="field-error" id="confirmar-clave-error" hidden></p>
          </div>

          <button class="btn btn-primary btn-block" type="submit" id="registro-submit">REGISTRAR USUARIO</button>

          <hr class="divider">

          <div class="action-row">
            <a class="btn btn-secondary" href="/login">Volver al Inicio de Sesión</a>
          </div>
        </form>
      </div>

      <p class="auth-card-foot">* Campos obligatorios. Ambas contraseñas deben coincidir.</p>
    </section>
  </main>

  <script src="/static/js/common.js"></script>
  <script src="/static/js/registro.js"></script>
</body>
</html>
